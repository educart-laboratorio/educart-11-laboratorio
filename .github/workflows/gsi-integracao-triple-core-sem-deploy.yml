name: "SUPER GSI | INTEGRACAO PRs 3-6 (sem deploy)"
on:
  push:
    branches:
      - gsi-integracao-triple-core-20261115
permissions:
  contents: read
jobs:
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://esjrjzyvyhtzwgihcbsc.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test_placeholder
      EDUCART_PRIVATE_PREVIEW_MODE: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Dependencias travadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TC04 - porta de entrada academica PROD sem consulta DEV
        run: node scripts/testar-tc04-prod-guard.mjs
      - name: TC04 - ensaio da migracao PROD em PostgreSQL sintetico sem rede
        run: bash scripts/testar-tc04-prod-migracao-sintetica.sh
      - name: Testes negativos do publicador PROD
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://doygnsubiitencoyzjzk.supabase.co
          EDUCART_OFFICIAL_11_MODE: required
        run: node scripts/testar-tc01-publicador-oficial-negativas.mjs
      - name: Guardas da portaria e mapeamento de triagem
        run: |
          node --experimental-strip-types scripts/testar-r43-portaria-oficial.mjs
          node --experimental-strip-types scripts/testar-tc06-triagem.mjs
          node --experimental-strip-types scripts/testar-r07-portaria-nativa.mjs
      - name: TypeScript em codigo integrado
        run: npx tsc --noEmit
      - name: Build Vinext integrada, sem deploy
        run: npm run build:vinext
      - name: Instalar Playwright Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Iniciar servidor loopback
        run: |
          npm run dev:vinext -- --host 127.0.0.1 > /tmp/educart-gsi-integracao.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:3001/ > /dev/null; then echo "Vinext local 200"; exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then tail -n 100 /tmp/educart-gsi-integracao.log; exit 1; fi
            sleep 2
          done
          tail -n 120 /tmp/educart-gsi-integracao.log
          exit 1
      - name: HTTP sitemap, robots, favicon e metadados
        run: node scripts/testar-tc13-http.mjs
      - name: Inscricao 201, 409, 500, timeout em quatro viewports
        env:
          TC02_BASE_URL: http://127.0.0.1:3001
        run: node scripts/testar-tc02-playwright.mjs
      - name: Triagem para inscricao, dez fluxos reais de navegador simulados
        env:
          TC02_BASE_URL: http://127.0.0.1:3001
        run: node scripts/testar-tc06-playwright.mjs
      - name: "Fundo, sobreposicoes e navegacao: 24 estados"
        env:
          TC0709_BASE_URL: http://127.0.0.1:3001
        run: node scripts/testar-tc07-09-playwright.mjs
      - name: Preservar screenshots e relatorios sem dados reais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-gsi-integracao-evidencias
          path: |
            apps/web/tc02-artifacts/
            apps/web/tc0709-artifacts/
          if-no-files-found: warn
          retention-days: 14
