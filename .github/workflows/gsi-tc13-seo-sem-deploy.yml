name: "SUPER GSI | TC-13 indexação segura (sem deploy)"
on:
  push:
    branches:
      - gsi-tc13-seo-rotas-publicas-20261115
  pull_request:
    branches:
      - secretaria-11-candidate-online-20261115
permissions:
  contents: read
jobs:
  verificar-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://esjrjzyvyhtzwgihcbsc.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
      EDUCART_PRIVATE_PREVIEW_MODE: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Dependencias fixadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typescript
        run: npx tsc --noEmit
      - name: Vinext build sem deploy
        run: npm run build:vinext
      - name: Vinext loopback
        run: |
          npm run dev:vinext -- --host 127.0.0.1 > /tmp/educart-tc13.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then tail -n 100 /tmp/educart-tc13.log; exit 1; fi
            sleep 2
          done
          tail -n 100 /tmp/educart-tc13.log
          exit 1
      - name: Provar sitemap, robots, favicon, canonicos e noindex
        run: node scripts/testar-tc13-http.mjs
