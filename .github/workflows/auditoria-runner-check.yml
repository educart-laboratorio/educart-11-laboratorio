name: "EducART | Prova de executor Actions isolado"
on:
  push:
    branches:
      - "auditoria/site-20261115"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar runner sem tocar producao
        run: |
          echo "runner_ok=true"
          echo "github_sha=$GITHUB_SHA"
          echo "sem deploy, sem segredos, sem dados privados"
