# R33 — candidata Cloudflare com SITE PUBLICO e PAINEL PRIVADO via portaria nativa + Supabase RLS.
# Inscrições, Formação e início são públicos; /admin, RSC, API e histórico exigem JWT e papel.
# A API Cloudflare Access respondeu 403; a portaria equivalente é comprovada em testes e HTTP.
# Publicação é EXCLUSIVAMENTE no Worker candidato com Supabase DEV; jamais produção.
# Falha de proteção remota aciona rollback da candidata.
# R07 portaria candidata 12/11/2026: relançamento isolado após CI validar success
# R37 14/11/2026: autorização Direção para atualizar APENAS candidata isolada com formulários guiados; CI 43647592306 success.
# R38 14/11/2026: aprovação docente; descartar jornada estudante, preservar /inscricao original; CI 43648832083 success.
# R39 14/11/2026: primeira ficha docente R35 restaurada integralmente; CI 43649364567 success; somente Worker candidato.
# R40 14/11/2026: campo de foto HD privado na ficha docente; CI 43650125346 success; somente candidata Cloudflare DEV.
name: "AutoDEV | Publicar candidata EducART 1.1 (Cloudflare isolada)"
on:
  push:
    branches:
      - autodev-r07-estudantes-codespaces-private-20261106
    paths:
      - .github/workflows/publicar-educart-11-candidate-cloudflare.yml
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite PUBLICAR-CANDIDATA para autorizar somente o Worker isolado"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: educart-11-candidate-cloudflare
  cancel-in-progress: false
jobs:
  publicar-candidata:
    if: github.ref_name == 'autodev-r07-estudantes-codespaces-private-20261106' && ((github.event_name == 'workflow_dispatch' && inputs.confirmacao == 'PUBLICAR-CANDIDATA') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-candidate-once]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: educart-11-candidate
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_ACCOUNT_ID: '8fe5407b4d31f20e19a1388527e365ad'
      EDUCART_DEPLOY_TARGET: staging
      WORKERS_CI: '1'
      WORKERS_CI_BRANCH: ${{ github.ref_name }}
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: https://esjrjzyvyhtzwgihcbsc.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_7hJp5v_mFazWyj9gga0Uig_TyfJI_VK
      CLOUDFLARE_API_TOKEN: ${{ secrets.EDUCART_CLOUDFLARE_CANDIDATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar segredos sem exibir valores
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Token Cloudflare ausente"; exit 1; }
          case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::Chave publicavel DEV ausente ou invalida"; exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Dependencias travadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comprovar portaria nativa antes da publicacao
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/testar-r07-portaria-nativa.mjs
          node --experimental-vm-modules scripts/testar-r07-proxy-execucao.mjs
          node scripts/testar-homologacao-gate-r29.mjs
      - name: Verificar integridade do publicador
        run: |
          node --check scripts/deploy-11-candidate.mjs
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const s=fs.readFileSync('scripts/deploy-11-candidate.mjs','utf8'); assert.match(s,/name:'educart-11-candidate'/); assert.doesNotMatch(s,/keep_vars\\s*:\\s*true/); assert.match(s,/account_id:'8fe5407b4d31f20e19a1388527e365ad'/);"
      - name: Build DEV real
        run: npm run build:vinext
      - name: Publicar somente Worker isolado
        id: publicar
        run: node scripts/deploy-11-candidate.mjs
      - name: Provar vitrine publica e bloqueio de rotas privadas no Worker publicado
        run: |
          set -euo pipefail
          host=https://educart-11-candidate.educartsuporte.workers.dev
          sleep 6
          falhou=0
          for spec in '/:200' '/formacao:200' '/inscricao:200' '/cadastro:200' '/criar:200' '/admin/login:200' '/admin:303' '/minha-educart:303' '/minha-educart/login:303'; do
            route=${spec%:*}; esperado=${spec##*:}
            atual=$(curl --silent --show-error --max-time 25 --output /dev/null --write-out '%{http_code}' \
              -H 'Accept: text/html' -H 'Cache-Control: no-cache' "$host$route")
            echo "$route: HTTP $atual (esperado $esperado)"
            if test "$atual" != "$esperado"; then falhou=1; echo "::error::Portaria divergiu em $route"; fi
          done
          headers=$(mktemp)
          status=$(curl --silent --show-error --max-time 25 --dump-header "$headers" \
            --output /dev/null --write-out '%{http_code}' -H 'Accept: text/html' "$host/admin/login")
          grep -iqE '^x-robots-tag:.*noindex' "$headers" || { echo "::error::Login indexavel"; falhou=1; }
          grep -iqE '^cache-control:.*no-store' "$headers" || { echo "::error::Cache login incorreto"; falhou=1; }
          rm -f "$headers"
          api=$(curl --silent --show-error --max-time 25 --output /dev/null \
            --write-out '%{http_code}' -X POST -H 'Accept: application/json' "$host/api/matriculas")
          echo "POST /api/matriculas sem JWT: HTTP $api (esperado 401)"
          test "$api" = 401 || { echo "::error::API nao bloqueada"; falhou=1; }
          rsc_headers=$(mktemp)
          rsc=$(curl --silent --show-error --max-time 25 --dump-header "$rsc_headers" \
            --output /dev/null --write-out '%{http_code}' -H 'Accept: text/html' -H 'RSC: 1' "$host/admin")
          if test "$rsc" = 307; then
            location=$(awk 'tolower($1)=="location:" {print $2}' "$rsc_headers" | tail -1 | tr -d '\r')
            test "$location" = "/admin?_rsc" || { echo "::error::RSC redirecionamento estranho"; falhou=1; }
            info=$(curl --silent --show-error --max-time 25 --location --max-redirs 4 \
              --output /dev/null --write-out '%{http_code} %{url_effective} %{num_redirects}' \
              -H 'Accept: text/html' -H 'RSC: 1' "$host/admin")
            read -r rsc_final rsc_dest rsc_n <<< "$info"
            test "$rsc_final" = 200 && test "$rsc_dest" = "$host/admin/login?_rsc" && test "$rsc_n" = 3 || {
              echo "::error::RSC nao terminou no formulario de login"; falhou=1;
            }
          elif test "$rsc" != 401; then
            echo "::error::RSC retornou HTTP $rsc em vez de negar"; falhou=1
          fi
          rm -f "$rsc_headers"
          test "$falhou" = 0 || { echo "::error::Protecao remota reprovada"; exit 1; }
          echo "Candidata protegida e vitrine publica validadas no Worker Cloudflare"
      - name: Rollback do Worker candidato se a prova remota falhar
        if: ${{ failure() && steps.publicar.outcome == 'success' }}
        run: |
          npx --yes wrangler@4.149.0 rollback --name educart-11-candidate --message "AutoDEV R33 rollback: verificacao HTTP pos-deploy falhou"
          echo "::warning::Rollback executado somente no Worker candidato; conferir propagacao dos assets"
